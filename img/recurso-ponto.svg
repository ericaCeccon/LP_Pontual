<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="ponto-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="ponto-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f89642" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#ponto-bg)" />
  <rect width="798" height="518" x="1" y="1" rx="15" fill="none" stroke="#2a2a2e" stroke-width="1.5" />

  <!-- Top bar -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Controle e Registro de Ponto Eletrônico</text>
    <rect x="580" y="0" width="172" height="34" rx="8" fill="#1b1b1f" stroke="#323238" stroke-width="1" />
    <circle cx="598" cy="17" r="4" fill="#51d87d" />
    <text x="610" y="21" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Portaria 671 MTE • Ativo</text>
  </g>

  <!-- Left: Live Clock-In Card -->
  <g transform="translate(24, 70)">
    <rect width="320" height="390" rx="12" fill="#18181c" stroke="#2a2a30" stroke-width="1" />
    
    <text x="24" y="36" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">HORÁRIO DE BRASÍLIA</text>
    <text x="24" y="80" fill="#ffffff" font-family="'Inter', sans-serif" font-size="40" font-weight="800" letter-spacing="-1">08:02<tspan fill="#f89642" font-size="24">:15</tspan></text>
    <text x="24" y="105" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="12">Terça-feira, 08 de Outubro de 2026</text>

    <!-- Geolocation & Face Recognition info -->
    <g transform="translate(24, 130)">
      <rect width="272" height="42" rx="8" fill="#201a14" stroke="#483321" stroke-width="1" />
      <!-- Pin icon -->
      <path d="M16 16 c0-4.4 3.6-8 8-8 s8 3.6 8 8 c0 5-8 14-8 14 s-8-9-8-14 z" fill="#f89642" />
      <circle cx="24" cy="16" r="3" fill="#18181c" />
      <text x="40" y="22" fill="#f89642" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Cerca Digital Validada</text>
      <text x="40" y="34" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Sede Principal • Raio: 15m</text>
    </g>

    <!-- Main Register Button -->
    <g transform="translate(24, 195)">
      <rect width="272" height="52" rx="10" fill="url(#ponto-accent)" />
      <!-- Fingerprint/Check icon -->
      <path d="M120 26 l6 6 l14 -14" fill="none" stroke="#12100e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="80" y="44" fill="#12100e" font-family="'Inter', sans-serif" font-size="14" font-weight="800">BATER PONTO</text>
    </g>

    <!-- Summary of the day -->
    <g transform="translate(24, 275)">
      <rect width="272" height="90" rx="8" fill="#121215" stroke="#25252b" stroke-width="1" />
      <text x="16" y="24" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Jornada Prevista:</text>
      <text x="210" y="24" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">08h00</text>
      
      <text x="16" y="50" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Banco de Horas:</text>
      <text x="200" y="50" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="700">+01h30m</text>

      <text x="16" y="74" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Status:</text>
      <text x="180" y="74" fill="#f89642" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Dentro do Turno</text>
    </g>
  </g>

  <!-- Right: Punch Timeline & Records -->
  <g transform="translate(365, 70)">
    <rect width="411" height="390" rx="12" fill="#18181c" stroke="#2a2a30" stroke-width="1" />
    <text x="24" y="36" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Espelho do Dia • Batidas Registradas</text>

    <!-- Timeline Entries -->
    <!-- 1. Entrada -->
    <g transform="translate(24, 60)">
      <rect width="363" height="60" rx="8" fill="#1f1f25" stroke="#2e2e38" stroke-width="1" />
      <rect x="16" y="14" width="32" height="32" rx="8" fill="#223b2b" />
      <text x="24" y="34" fill="#51d87d" font-family="'Inter', sans-serif" font-size="14" font-weight="700">E1</text>
      <text x="60" y="28" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Entrada no Turno</text>
      <text x="60" y="44" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Reconhecimento facial • Geolocalizado</text>
      <text x="290" y="35" fill="#51d87d" font-family="'Inter', sans-serif" font-size="15" font-weight="700">08:02</text>
    </g>

    <!-- 2. Almoço Saída -->
    <g transform="translate(24, 135)">
      <rect width="363" height="60" rx="8" fill="#1f1f25" stroke="#2e2e38" stroke-width="1" />
      <rect x="16" y="14" width="32" height="32" rx="8" fill="#3b2b1a" />
      <text x="24" y="34" fill="#f89642" font-family="'Inter', sans-serif" font-size="14" font-weight="700">S1</text>
      <text x="60" y="28" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Saída Intervalo</text>
      <text x="60" y="44" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Pausa para refeição (1h)</text>
      <text x="290" y="35" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="15" font-weight="700">12:00</text>
    </g>

    <!-- 3. Almoço Retorno -->
    <g transform="translate(24, 210)">
      <rect width="363" height="60" rx="8" fill="#1f1f25" stroke="#2e2e38" stroke-width="1" />
      <rect x="16" y="14" width="32" height="32" rx="8" fill="#223b2b" />
      <text x="24" y="34" fill="#51d87d" font-family="'Inter', sans-serif" font-size="14" font-weight="700">E2</text>
      <text x="60" y="28" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Retorno Intervalo</text>
      <text x="60" y="44" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Reconhecimento facial • Geolocalizado</text>
      <text x="290" y="35" fill="#51d87d" font-family="'Inter', sans-serif" font-size="15" font-weight="700">13:00</text>
    </g>

    <!-- 4. Saída Prevista -->
    <g transform="translate(24, 285)">
      <rect width="363" height="60" rx="8" fill="#18181f" stroke="#2c2c34" stroke-dasharray="4" stroke-width="1" />
      <rect x="16" y="14" width="32" height="32" rx="8" fill="#23232b" />
      <text x="24" y="34" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="14" font-weight="700">S2</text>
      <text x="60" y="28" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Saída Fim de Turno (Prevista)</text>
      <text x="60" y="44" fill="#666670" font-family="'Inter', sans-serif" font-size="10">Horário contratual regular</text>
      <text x="290" y="35" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="15" font-weight="700">17:02</text>
    </g>

    <!-- Export link -->
    <g transform="translate(24, 355)">
      <text x="0" y="18" fill="#f89642" font-family="'Inter', sans-serif" font-size="11" font-weight="600">📄 Baixar comprovante assinado digitalmente (PDF)</text>
    </g>
  </g>

  <!-- Bottom status note -->
  <g transform="translate(24, 480)">
    <circle cx="10" cy="10" r="4" fill="#51d87d" />
    <text x="22" y="14" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">Criptografia de ponta a ponta e comprovante instantâneo por e-mail e WhatsApp</text>
  </g>
</svg>
