    <text x="24" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="700">COLABORADOR / SETOR</text>
    <text x="310" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CHECK-IN</text>
    <text x="440" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="700">LOCALIZAÇÃO</text>
    <text x="630" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATUS</text>

    <!-- Row 1 -->
    <g transform="translate(0, 46)">
      <circle cx="36" cy="18" r="14" fill="#305a40" />
      <text x="31" y="22" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="700">MS</text>
      <text x="60" y="15" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Mariana Souza</text>
      <text x="60" y="29" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Atendimento ao Cliente • Matriz</text>
      <text x="310" y="22" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12">08:00 (No horário)</text>
      <text x="440" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">📍 Polo Central • Sala 04</text>
      <rect x="620" y="6" width="105" height="26" rx="6" fill="#1c3325" stroke="#37724f" stroke-width="1" />
      <text x="635" y="23" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● PRESENTE</text>
    </g>

    <line x1="24" y1="92" x2="728" y2="92" stroke="#25252b" stroke-width="1" />

    <!-- Row 2 -->
    <g transform="translate(0, 102)">
      <circle cx="36" cy="18" r="14" fill="#9F243C" />
      <text x="31" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">CS</text>
      <text x="60" y="15" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Carlos Silva</text>
      <text x="60" y="29" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Operações e Logística • Galpão B</text>
      <text x="310" y="22" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12">07:58 (No horário)</text>
      <text x="440" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">📍 Galpão Distribuição</text>
      <rect x="620" y="6" width="105" height="26" rx="6" fill="#1c3325" stroke="#37724f" stroke-width="1" />
      <text x="635" y="23" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● PRESENTE</text>
    </g>

    <line x1="24" y1="148" x2="728" y2="148" stroke="#25252b" stroke-width="1" />

    <!-- Row 3: Atrasado -->
    <g transform="translate(0, 158)">
      <circle cx="36" cy="18" r="14" fill="#f89642" />
      <text x="31" y="22" fill="#12100e" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FO</text>
      <text x="60" y="15" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Felipe Oliveira</text>
      <text x="60" y="29" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Suporte Técnico • Matriz</text>
      <text x="310" y="22" fill="#f89642" font-family="'Inter', sans-serif" font-size="12">08:14 (+14 min)</text>
      <text x="440" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">📍 Polo Central • Recepção</text>
      <rect x="620" y="6" width="105" height="26" rx="6" fill="#3a2517" stroke="#875129" stroke-width="1" />
      <text x="635" y="23" fill="#f89642" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● ATRASADO</text>
    </g>

    <line x1="24" y1="204" x2="728" y2="204" stroke="#25252b" stroke-width="1" />

    <!-- Row 4: Em Pausa -->
    <g transform="translate(0, 214)">
      <circle cx="36" cy="18" r="14" fill="#2d284a" />
      <text x="31" y="22" fill="#a493f7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">BS</text>
      <text x="60" y="15" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Beatriz Santos</text>
      <text x="60" y="29" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Supervisão Comercial</text>
      <text x="310" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="12">12:00 (Pausa refeição)</text>
      <text x="440" y="22" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">📍 Refeitório Sede</text>
      <rect x="620" y="6" width="105" height="26" rx="6" fill="#262338" stroke="#544c7d" stroke-width="1" />
      <text x="635" y="23" fill="#a493f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">● EM PAUSA</text>
    </g>
  </g>

  <!-- Bottom tip -->
  <g transform="translate(24, 480)">
    <circle cx="10" cy="10" r="4" fill="#51d87d" />
    <text x="22" y="14" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">Visualização instantânea de desfalques para remanejamento de turnos</text>
  </g>
</svg>
