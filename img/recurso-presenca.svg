<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="pres-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="pres-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F243C" />
      <stop offset="100%" stop-color="#d1385d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#pres-bg)" />
  <rect width="798" height="518" x="1" y="1" rx="15" fill="none" stroke="#2a2a2e" stroke-width="1.5" />

  <!-- Top bar -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Painel de Presença em Tempo Real</text>
    <rect x="620" y="0" width="132" height="34" rx="8" fill="#2c141d" stroke="#9F243C" stroke-width="1" />
    <circle cx="636" cy="17" r="4" fill="#d1385d" />
    <text x="648" y="21" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Ao Vivo • 14:32</text>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(24, 68)">
    <!-- Card 1: Presentes -->
    <rect width="170" height="64" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <circle cx="26" cy="24" r="5" fill="#51d87d" />
    <text x="38" y="27" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">NO POSTO</text>
    <text x="24" y="52" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="22" font-weight="800">46 <tspan fill="#51d87d" font-size="13">/ 48 (96%)</tspan></text>

    <!-- Card 2: Atrasos -->
    <rect x="185" y="0" width="170" height="64" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <circle cx="211" cy="24" r="5" fill="#f89642" />
    <text x="223" y="27" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ATRASOS</text>
    <text x="209" y="52" fill="#f89642" font-family="'Inter', sans-serif" font-size="22" font-weight="800">2 <tspan fill="#8e8e93" font-size="13">notificados</tspan></text>

    <!-- Card 3: Ausências -->
    <rect x="370" y="0" width="170" height="64" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <circle cx="396" cy="24" r="5" fill="#d1385d" />
    <text x="408" y="27" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">FALTAS NÃO JUSTIF.</text>
    <text x="394" y="52" fill="#51d87d" font-family="'Inter', sans-serif" font-size="22" font-weight="800">0 <tspan fill="#8e8e93" font-size="13">zero faltas</tspan></text>

    <!-- Card 4: Em Pausa -->
    <rect x="555" y="0" width="197" height="64" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <circle cx="581" cy="24" r="5" fill="#d8b459" />
    <text x="593" y="27" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">EM INTERVALO</text>
    <text x="579" y="52" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="22" font-weight="800">4 <tspan fill="#8e8e93" font-size="13">colaboradores</tspan></text>
  </g>

  <!-- Team Live List -->
  <g transform="translate(24, 150)">
    <rect width="752" height="315" rx="12" fill="#18181c" stroke="#2a2a30" stroke-width="1" />

    <!-- List Header -->
