<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="gest-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="gest-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#640c1e" />
      <stop offset="100%" stop-color="#96183c" />
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#96183c" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#96183c" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="16" fill="url(#gest-bg)" />
  <rect width="798" height="518" x="1" y="1" rx="15" fill="none" stroke="#2a2a2e" stroke-width="1.5" />

  <!-- Top bar -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="16" font-weight="700">Gestão Estratégica &amp; Relatórios de Desempenho</text>
    <rect x="580" y="0" width="172" height="34" rx="8" fill="url(#gest-accent)" />
    <text x="605" y="22" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">📥 Exportar Folha (PDF/XLS)</text>
  </g>

  <!-- KPI Metrics -->
  <g transform="translate(24, 68)">
    <rect width="170" height="74" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <text x="18" y="24" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">TAXA DE ASSIDUIDADE</text>
    <text x="18" y="52" fill="#51d87d" font-family="'Inter', sans-serif" font-size="24" font-weight="800">98.4%</text>
    <text x="18" y="68" fill="#51d87d" font-family="'Inter', sans-serif" font-size="10">▲ +2.3% vs mês anterior</text>

    <rect x="185" y="0" width="170" height="74" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <text x="203" y="24" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">HORAS EXTRAS</text>
    <text x="203" y="52" fill="#f89642" font-family="'Inter', sans-serif" font-size="24" font-weight="800">-18.2%</text>
    <text x="203" y="68" fill="#51d87d" font-family="'Inter', sans-serif" font-size="10">▼ Redução de custos</text>

    <rect x="370" y="0" width="170" height="74" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <text x="388" y="24" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ÍNDICE ABSENTEÍSMO</text>
    <text x="388" y="52" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="24" font-weight="800">1.2%</text>
    <text x="388" y="68" fill="#51d87d" font-family="'Inter', sans-serif" font-size="10">Abaixo da média setorial</text>

    <rect x="555" y="0" width="197" height="74" rx="10" fill="#18181c" stroke="#28282e" stroke-width="1" />
    <text x="573" y="24" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CUSTO OPERACIONAL</text>
    <text x="573" y="52" fill="#d8b459" font-family="'Inter', sans-serif" font-size="24" font-weight="800">Otimizado</text>
    <text x="573" y="68" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">100% das regras CLT ok</text>
  </g>

  <!-- Middle Analytics Area: Chart + Department Breakdown -->
  <g transform="translate(24, 156)">
    <!-- Main Chart Box -->
    <rect width="470" height="295" rx="12" fill="#18181c" stroke="#2a2a30" stroke-width="1" />
    <text x="24" y="32" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Cumprimento de Jornada e Produtividade (Semanal)</text>

    <!-- Chart Grid Lines -->
    <g transform="translate(40, 60)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#26262c" stroke-width="1" stroke-dasharray="3" />
      <text x="-30" y="4" fill="#666670" font-family="'Inter', sans-serif" font-size="9">100%</text>

      <line x1="0" y1="50" x2="390" y2="50" stroke="#26262c" stroke-width="1" stroke-dasharray="3" />
      <text x="-30" y="54" fill="#666670" font-family="'Inter', sans-serif" font-size="9">75%</text>

      <line x1="0" y1="100" x2="390" y2="100" stroke="#26262c" stroke-width="1" stroke-dasharray="3" />
      <text x="-30" y="104" fill="#666670" font-family="'Inter', sans-serif" font-size="9">50%</text>

      <line x1="0" y1="150" x2="390" y2="150" stroke="#26262c" stroke-width="1" />
      <text x="-30" y="154" fill="#666670" font-family="'Inter', sans-serif" font-size="9">0%</text>

      <!-- Chart Area Fill -->
      <path d="M 0 60 Q 65 30 130 45 T 260 20 T 390 10 L 390 150 L 0 150 Z" fill="url(#chart-grad)" />
      
      <!-- Chart Line -->
      <path d="M 0 60 Q 65 30 130 45 T 260 20 T 390 10" fill="none" stroke="#d1385d" stroke-width="3" />

      <!-- Data Dots -->
      <circle cx="0" cy="60" r="4" fill="#d1385d" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="130" cy="45" r="4" fill="#d1385d" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="260" cy="20" r="4" fill="#d1385d" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="390" cy="10" r="5" fill="#f89642" stroke="#ffffff" stroke-width="1.5" />

      <!-- Days labels -->
      <text x="0" y="172" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Seg</text>
      <text x="90" y="172" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Ter</text>
      <text x="180" y="172" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Qua</text>
      <text x="270" y="172" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Qui</text>
      <text x="360" y="172" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="10">Sex</text>
    </g>

    <text x="40" y="265" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">● Produtividade média: <tspan fill="#51d87d" font-weight="700">97.8%</tspan> com conformidade legal plena</text>

    <!-- Side Breakdown Box -->
    <g transform="translate(485, 0)">
      <rect width="243" height="295" rx="12" fill="#18181c" stroke="#2a2a30" stroke-width="1" />
      <text x="18" y="32" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Por Departamento</text>

      <!-- Dept 1: Operações -->
      <g transform="translate(18, 55)">
        <text x="0" y="14" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Operações</text>
        <text x="160" y="14" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="700">99%</text>
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#2a2a30" />
        <rect x="0" y="22" width="203" height="6" rx="3" fill="#51d87d" />
      </g>

      <!-- Dept 2: Atendimento -->
      <g transform="translate(18, 105)">
        <text x="0" y="14" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Atendimento</text>
        <text x="160" y="14" fill="#d8b459" font-family="'Inter', sans-serif" font-size="11" font-weight="700">96%</text>
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#2a2a30" />
        <rect x="0" y="22" width="197" height="6" rx="3" fill="#d8b459" />
      </g>

      <!-- Dept 3: Logística -->
      <g transform="translate(18, 155)">
        <text x="0" y="14" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Logística</text>
        <text x="160" y="14" fill="#f89642" font-family="'Inter', sans-serif" font-size="11" font-weight="700">94%</text>
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#2a2a30" />
        <rect x="0" y="22" width="192" height="6" rx="3" fill="#f89642" />
      </g>

      <!-- Dept 4: Administrativo -->
      <g transform="translate(18, 205)">
        <text x="0" y="14" fill="#f5f5f7" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Administrativo</text>
        <text x="160" y="14" fill="#51d87d" font-family="'Inter', sans-serif" font-size="11" font-weight="700">100%</text>
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#2a2a30" />
        <rect x="0" y="22" width="205" height="6" rx="3" fill="#51d87d" />
      </g>
    </g>
  </g>

  <!-- Bottom tip -->
  <g transform="translate(24, 480)">
    <circle cx="10" cy="10" r="4" fill="#51d87d" />
    <text x="22" y="14" fill="#8e8e93" font-family="'Inter', sans-serif" font-size="11">Relatórios integrados prontos para folha de pagamento e contabilidade</text>
  </g>
</svg>
